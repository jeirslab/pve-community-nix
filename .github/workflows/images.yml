# images — build service images and push them to GHCR
# (ghcr.io/jeirslab/svc/<name>). Built on GitHub runners for now; the plan is
# to build on Hydra and only push from here.
#
# Tags: pushes to nightly → :edge; to stable → :stable; PRs into nightly →
# :pr-<number> (so an agent's image can be pulled and tried before merge).
# Every push also tags :sha-<commit>. Only services changed in the push/PR
# are built; workflow_dispatch builds the services you name, or all.

name: images

on:
  push:
    branches: [ nightly, stable ]
    paths: [ "services/**", "lib/**", "flake.lock" ]
  pull_request:
    branches: [ nightly ]
    paths: [ "services/**" ]
  workflow_dispatch:
    inputs:
      services:
        description: Space-separated service names (empty = all)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.p.outputs.services }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: p
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          WANT: ${{ inputs.services }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          all="$(find services -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort)"
          if [ "${EVENT}" = workflow_dispatch ]; then
            list="$(tr -s ' ' '\n' <<< "${WANT:-${all}}")"
          elif git diff --name-only "${BASE}" HEAD 2>/dev/null | grep -qE '^(lib/|flake\.lock$)'; then
            list="${all}"   # framework or nixpkgs changed: every image changes
          else
            list="$(git diff --name-only "${BASE}" HEAD | sed -n 's|^services/\([^/]*\)/.*|\1|p' | sort -u \
              | while read -r s; do [ -d "services/${s}" ] && echo "${s}"; done)"
          fi
          echo "services=$(printf '%s\n' "${list}" | sed '/^$/d' | jq -Rnc '[inputs]')" >> "${GITHUB_OUTPUT}"
          case "${EVENT}:${GITHUB_REF_NAME}" in
            pull_request:*) tag="pr-${PR}" ;;
            *:nightly) tag="edge" ;;
            *:stable) tag="stable" ;;
            *) tag="dev" ;;
          esac
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  build:
    needs: plan
    if: needs.plan.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build
        run: nix build -L ".#packages.x86_64-linux.${{ matrix.service }}-image" -o image.tar.gz
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SERVICE: ${{ matrix.service }}
        run: |
          ref="ghcr.io/jeirslab/svc/${SERVICE}"
          for t in "${TAG}" "sha-${GITHUB_SHA::12}"; do
            nix run nixpkgs#skopeo -- copy --dest-creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
              docker-archive:image.tar.gz "docker://${ref}:${t}"
          done
          echo "pushed ${ref}:${TAG}" >> "${GITHUB_STEP_SUMMARY}"
