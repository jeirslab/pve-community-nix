# check — the merge gate. For a PR or push: the framework self-test when
# lib/, tools/, templates/ or the flake changed; tools/verify-service.sh for
# every changed service (eval, image, compose, parity VM test); and for
# agent PRs, a guard that only one services/<name>/ directory changed.

name: check

on:
  pull_request:
    branches: [ nightly, unstable, stable ]
  push:
    branches: [ nightly, unstable ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.c.outputs.services }}
      framework: ${{ steps.c.outputs.framework }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          AI: ${{ contains(github.event.pull_request.labels.*.name, 'ai-generated') }}
        run: |
          if [ -z "${BASE}" ] || [ "${BASE}" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "${BASE}" 2>/dev/null; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "${BASE}" HEAD)"
          fi
          services="$(printf '%s\n' "${files}" | sed -n 's|^services/\([^/]*\)/.*|\1|p' | sort -u \
            | while read -r s; do [ -d "services/${s}" ] && echo "${s}"; done)"
          echo "services=$(printf '%s\n' "${services}" | sed '/^$/d' | jq -Rnc '[inputs]')" >> "${GITHUB_OUTPUT}"
          if printf '%s\n' "${files}" | grep -qE '^(lib/|tools/|templates/|flake\.(nix|lock)$|docs/)'; then
            echo "framework=true" >> "${GITHUB_OUTPUT}"
          else
            echo "framework=false" >> "${GITHUB_OUTPUT}"
          fi
          # Agent PRs may only touch their one service.
          if [ "${AI}" = true ] || [ "${HEAD_REF#svc/}" != "${HEAD_REF}" ]; then
            outside="$(printf '%s\n' "${files}" | grep -v -e '^services/' -e '^\.claude/\.sessions/' || true)"
            count="$(printf '%s\n' "${services}" | sed '/^$/d' | wc -l)"
            if [ -n "${outside}" ] || [ "${count}" -gt 1 ]; then
              echo "::error::agent PR must change exactly one services/<name>/ directory; also changed: ${outside}"
              exit 1
            fi
          fi

  framework:
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Framework self-test (fixture eval + parity), docs and PVE host tools
        run: |
          nix build -L --no-link \
            .#checks.x86_64-linux.framework-fixture-eval \
            .#checks.x86_64-linux.framework-fixture-parity \
            .#checks.x86_64-linux.framework-docs \
            .#checks.x86_64-linux.framework-pve-post-install

  service:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Verify ${{ matrix.service }}
        run: tools/verify-service.sh "${{ matrix.service }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.service }}
          path: .agent/
          include-hidden-files: true
          if-no-files-found: ignore
